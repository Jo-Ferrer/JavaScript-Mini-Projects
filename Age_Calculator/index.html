<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Age Calculator</title>
    <link rel="icon" type="image/png" href="calen.png">
    <link rel="stylesheet" href="design.css">


</head>
<body>

    <div class="frame">
        <div class="icon_container">
            <img src="calen.png" alt="icon" class="icon">
        </div>
        <p class="title">Age Calculator</p>
        <p class="description">Select your date of birth to calculate your age</p>  
        
        <div class="date_title">
            <p>Date of Birth</p>
        </div>
        <input type="date" id="date" name="date" >
        
        <button id="button" class="button">Calculate Age</button>

        <div class="line-text">
            <span>Your Age</span>
        </div>

        <div class="age_container">
            <h1 id="age" class="age">0 years old</h1>
        </div>
        
        <div class="info_container">
            <img src="info.png" alt="icon" class="info_ico">
            <p class="info">Age is calculated based on today's date.</p>
        </div>

    </div>

    <script src="script.js"></script>


</body>
</html>
