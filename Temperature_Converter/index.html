<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="design.css">

</head>

<body>

    <div class="mainFrame">

        <img class="icon" src="thermometer.png" alt="Icon">
        <p class="title">Temperature Converter</p>

        <p class="text">Temperature</p>
        <input id="current" class="input_temp" type="number" placeholder="Enter temperature">

        <p class="text">From</p>
        <select class="select" name="" id="prevTemp">
            <option value="c">Celsius (°C)</option>
            <option value="f">Fahrenheit (°F)</option>
            <option value="k">Kelvin (K)</option>
        </select>

        <p class="text">To</p>
        <select class="select" name="" id="afterTemp">
            <option value="f">Fahrenheit (°F)</option>
            <option value="c">Celsius (°C)</option>
            <option value="k">Kelvin (K)</option>
        </select>
        
        <button class="butt" id="button" type="submit">Convert</button>

        <div class="result_container">

            <p class="result_text">Result</p>
            <p id="result" class="result_value">0</p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
