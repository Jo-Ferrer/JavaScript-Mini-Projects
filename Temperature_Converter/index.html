<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="design.css">

</head>

<body>

    <div class="mainFrame">

        <img class="icon" src="thermometer.png" alt="Icon">
        <p class="title">Temperature Converter</p>

        <p class="text">Temperature</p>
        <input class="input_temp" type="number" placeholder="Enter temperature">

        <p class="text">From</p>
        <select class="select" name="" id="prevTemp">
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="kelvin">Kelvin (K)</option>
        </select>

        <p class="text">To</p>
        <select class="select" name="" id="AfterTemp">
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="celsius">Celsius (°C)</option>
            <option value="kelvin">Kelvin (K)</option>
        </select>
        
        <button class="butt" id="button">Convert</button>

        <div class="result_container">

            <p class="result_text">Result</p>
            <p class="result_value">26.6 °F</p>

        </div>






    </div>








    
</body>
</html>
