<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dice Roll Simulator</title>

    <link rel="stylesheet" href="design.css">

</head>

<body>

    <div class="mainFrame">
            
        <div class="titleFrame">
            
            <img class="dicePic" src="img/dice.png" alt="logo">
            <p class="titleText">Dice Roll Simulator</p>

        </div>
            
        <p class="desriptionText">Roll dice and see your results</p>

        <div>

            <img id="currectDie" class="RollPic" src="img/1.png" alt="dice">

        </div>

        <div>

            <button id="button" class="diceButton">Roll Dice</button>

        </div>

        <div class="lineDescription">

            <img src="" alt="">
            <p class="spade">♤</p>

        </div>

        <div class="historyContainer" >

            <div class="historyTitleContainer">

                <p class="historyTitle">ROLL HISTORY</p>
                <button id="trashButton" class="trashButton">
                    <img src="img/trash.png" alt="Delete">
                </button>

            </div>

            <div class="history">

                <div class="historyHeader">
                    <span>#</span>
                    <span>RESULT</span>
                    <span>TIME</span>
                </div>

                <div id="history-list">

                    <div class="historyRow">
                        <span>1</span>

                        <div class="result">
                            <img id="picResult1" class="dicePicHistory">
                            <span id="numResult1"></span>
                        </div>

                        <span id="time1"></span>
                    </div>

                    <div class="historyRow">
                        <span>2</span>

                        <div class="result">
                            <img id="picResult2" class="dicePicHistory">
                            <span id="numResult2"></span>
                        </div>

                        <span id="time2"></span>
                    </div>

                    <div class="historyRow">
                        <span>3</span>

                        <div class="result">
                            <img id="picResult3" class="dicePicHistory">
                            <span id="numResult3"></span>
                        </div>

                        <span id="time3"></span>
                    </div>

                    <div class="historyRow">
                        <span>4</span>

                        <div class="result">
                            <img id="picResult4" class="dicePicHistory">
                            <span id="numResult4"></span>
                        </div>

                        <span id="time4"></span>
                    </div>

                    <div class="historyRow">
                        <span>5</span>

                        <div class="result">
                            <img id="picResult5" class="dicePicHistory">
                            <span id="numResult5"></span>
                        </div>

                        <span id="time5"></span>
                    </div>

                </div>

            </div>
        
        </div>

        

        <div class="lineDescription">

            <img src="" alt="">
            <p class="endDescription">STANDARD 6 - SIDED DICE (1-6)</p>

        </div>


    </div>   

    <script src="script.js"></script>

</body>

</html>
