<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Password Generator</title>

    <link rel="stylesheet" href="design.css">

</head>
<body> 

    <div class="mainFrame">

        <img class="lockPic" src="img/lock.png" alt="lock">
        <p class="title">Password Generator</p>
        <p class="description">Create strong, secure passwords in seconds.</p>
        
        <div class="passwordFrame">

            <p class="password">7Kf!pQ2#Lm9@zT</p>
            <button class="copyButton"><img src="img/copy.png" alt="copy"></button>

        </div>

        <div class="lengthFrame">

            <p class="lengthText">Length</p>
            <div class="valueFrame">
                <p id="value" class="lengthValue"></p>
            </div>
            

        </div>

        <input
            id="slider"
            type="range"
            class="slider"
            min="4"
            max="32"
            value="16">

        <div class="numFrame">

            <p class="numText">4</p>
            <p class="numText">32</p>

        </div>

        <div class="checkboxMain">

            <div class="checkboxContainer">

                <input type="checkbox" id="uppercase">
                <label style="color: #2d81a8;" for="uppercase">ABC</label>

                <input type="checkbox" id="lowercase">
                <label style="color: #56be78;" for="lowercase">abc</label>

                <input type="checkbox" id="numbers">
                <label style="color: #d66476;" for="numbers">123</label>

                <input type="checkbox" id="symbols">
                <label style="color: #9060db;" for="symbols">!@#</label>


            </div>

            <div class="checkboxDescContainer">

                <label for="uppercase">Uppercase</label>
                <label for="lowercase">Lowercase</label>
                <label for="numbers">Numbers</label>
                <label for="symbols">Symbols</label>


            </div>



        </div>

        

        


    </div>

    <script src="script.js"></script>
    
</body>
</html>
